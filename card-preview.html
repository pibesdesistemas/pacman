<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador X (Twitter) Player Card - 480x480</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #000;
            color: #e7e9ea;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 24px 12px;
            display: flex;
            justify-content: center;
        }
        .tweet-card {
            width: 100%;
            max-width: 520px;
            border: 1px solid #2f3336;
            border-radius: 16px;
            padding: 16px;
            background: #000;
        }
        .tweet-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #ffff00;
            color: #000;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .author-name { font-weight: 700; font-size: 15px; }
        .author-handle { color: #71767b; font-size: 14px; }
        .tweet-text {
            font-size: 15px;
            line-height: 1.4;
            margin-bottom: 12px;
        }
        .player-container {
            width: 480px;
            height: 480px;
            max-width: 100%;
            aspect-ratio: 1 / 1;
            margin: 0 auto;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid #2f3336;
            background: #111;
        }
        .player-container iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }
        .meta-info {
            margin-top: 12px;
            font-size: 12px;
            color: #71767b;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>
    <div class="tweet-card">
        <div class="tweet-header">
            <div class="avatar">ᗧ</div>
            <div>
                <div class="author-name">Arcade en X</div>
                <div class="author-handle">@pacman_card · Ahora</div>
            </div>
        </div>
        <div class="tweet-text">
            ¡Juega Ms. Pac-Man directamente desde el feed sin salir de X! 🕹️👻<br>
            Controles: Flechas / WASD en Desktop o D-Pad / Swipe en móvil.
        </div>
        <div class="player-container">
            <iframe
                src="./play.html"
                width="480"
                height="480"
                sandbox="allow-scripts allow-same-origin"
                allow="autoplay; fullscreen; gamepad"
                title="jsPacman Player Card">
            </iframe>
        </div>
        <div class="meta-info">
            <span>Twitter Player Card (480×480 Sandbox)</span>
            <span><a href="./play.html" style="color: #1d9bf0;">Abrir play.html directo ↗</a></span>
        </div>
    </div>
</body>
</html>
