    <!-- Open Graph Fallback -->

    <meta property="og:image" content="https://pibesdesistemas.github.io/pacman/assets/preview.png">

    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png">
    <link rel="manifest" href="./site.webmanifest">
    <link rel="mask-icon" href="./safari-pinned-tab.svg" color="#222222">
    <link rel="stylesheet" href="./styles.css">

    <script type="importmap">
    {
        "imports": {
            "rasti/Model.js": "./js/vendor/rasti/Model.js",
            "rasti/View.js": "./js/vendor/rasti/View.js"
        }
    }
    </script>
</head>
<body>
    <!-- Contenedor Principal del Juego -->
    <div class="js-pacman-container">
        <div class="js-pacman-playground"></div>
    </div>

    <!-- Esquema de Controles Híbrido: D-Pad Virtual (visible en dispositivos táctiles @media (pointer: coarse)) -->
    <div class="virtual-dpad" aria-label="Controles táctiles">
        <button type="button" class="dpad-btn dpad-up" data-dir="u" aria-label="Arriba">▲</button>
        <button type="button" class="dpad-btn dpad-left" data-dir="l" aria-label="Izquierda">◀</button>
        <button type="button" class="dpad-btn dpad-pause" data-action="pause" aria-label="Pausa">II</button>
        <button type="button" class="dpad-btn dpad-right" data-dir="r" aria-label="Derecha">▶</button>
        <button type="button" class="dpad-btn dpad-down" data-dir="d" aria-label="Abajo">▼</button>
    </div>

    <script type="module" src="./index.js"></script>
</body>
</html>
